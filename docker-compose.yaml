version: '3.8'

services:
  # --- Fila ---
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Porta para comunicação (Python vai usar essa)
      - "15672:15672" # Interface visual (para você ver as mensagens chegando)
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  # --- Banco de Dados ---
  mongodb:
    image: mongo:6.0
    container_name: gdash_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  # --- Visualizador do Banco ---
  mongo-express:
    image: mongo-express
    container_name: gdash_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo_data: